services:
  - type: web
    name: ia-legal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: EMBEDDING_PROVIDER
        value: chroma
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: LLM_MODEL_FALLBACKS
        value: z-ai/glm-5.2:free,google/gemma-4-31b-it:free,nvidia/nemotron-3.5-lightning:free
      - key: LLM_MAX_TOKENS
        value: "800"
      - key: LLM_API_KEY
        sync: false
      - key: APP_USER
        value: professor
      - key: APP_PASSWORD
        sync: false
